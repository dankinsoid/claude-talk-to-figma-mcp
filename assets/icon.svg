<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f27"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a259ff"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- wire -->
  <path d="M 40 64 C 54 64, 74 64, 88 64" fill="none" stroke="url(#wire)" stroke-width="6" stroke-linecap="round"/>
  <!-- left node: Figma (purple) -->
  <circle cx="40" cy="64" r="16" fill="#a259ff"/>
  <circle cx="40" cy="64" r="6" fill="#fff" opacity="0.9"/>
  <!-- right node: Claude (orange spark) -->
  <circle cx="88" cy="64" r="16" fill="#d97757"/>
  <text x="88" y="73" fill="#1c1f27" font-size="22" font-weight="700" text-anchor="middle">✳</text>
